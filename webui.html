<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swhisper</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #22262f; --border: #2e3340;
    --text: #d7dce4; --muted: #8b93a3; --accent: #5aa7ff; --ok: #4cc38a;
    --warn: #e5b567; --err: #e5735f; --badge: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .dir { color: var(--muted); font-size: 12px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  select, button, input, textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0c1016; border-color: var(--accent); font-weight: 600; }
  button.danger  { color: var(--err); }
  button:disabled { opacity: .45; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }

  /* file list */
  #files { width: 340px; border-right: 1px solid var(--border); overflow-y: auto;
           background: var(--panel); }
  #files .file { padding: 10px 14px; border-bottom: 1px solid var(--border);
                 cursor: pointer; }
  #files .file:hover { background: var(--panel2); }
  #files .file.sel { background: var(--panel2); border-left: 3px solid var(--accent); padding-left: 11px; }
  #files .name { font-weight: 600; word-break: break-all; }
  .badges { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: var(--badge); color: var(--muted); }
  .badge.on-ok   { color: var(--ok);   border: 1px solid var(--ok); background: transparent; }
  .badge.on-info { color: var(--accent); border: 1px solid var(--accent); background: transparent; }
  .badge.on-warn { color: var(--warn); border: 1px solid var(--warn); background: transparent; }

  /* right column */
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #editor { flex: 1; overflow-y: auto; padding: 16px 20px; }
  #editor .placeholder { color: var(--muted); margin-top: 40px; text-align: center; }
  .group { margin-bottom: 18px; }
  .group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); margin: 0 0 6px; border-bottom: 1px solid var(--border);
              padding-bottom: 4px; }
  .row { display: grid; grid-template-columns: 300px 1fr; gap: 10px; align-items: center;
         padding: 3px 0; }
  .row label { color: var(--text); font-size: 13px; word-break: break-all; }
  .row label .stage { color: var(--muted); font-size: 10px; margin-left: 6px; }
  .row input, .row select, .row textarea { width: 100%; max-width: 460px; }
  .row input.set, .row select.set, .row textarea.set { border-color: var(--accent); }
  .row .note { grid-column: 2; color: var(--muted); font-size: 11px; margin-top: -2px; }
  #editorBar { display: flex; gap: 10px; align-items: center; padding: 10px 20px;
               border-top: 1px solid var(--border); background: var(--panel); }
  #editorBar .msg { color: var(--muted); font-size: 12px; flex: 1; }
  #editorBar .msg.err { color: var(--err); }
  #editorBar .msg.ok { color: var(--ok); }

  /* run panel */
  #runPanel { border-top: 1px solid var(--border); background: var(--panel);
              display: flex; flex-direction: column; height: 280px; min-height: 42px; }
  #runBar { display: flex; gap: 10px; align-items: center; padding: 8px 16px; }
  #runBar .status { font-size: 12px; color: var(--muted); flex: 1; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: var(--muted); margin-right: 6px; }
  .dot.run { background: var(--ok); animation: pulse 1.2s infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  #log { flex: 1; overflow-y: auto; margin: 0 16px 10px; padding: 8px 10px;
         background: #0d0f13; border: 1px solid var(--border); border-radius: 6px;
         font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap;
         word-break: break-all; color: #b9c2d0; }
</style>
</head>
<body>
<header>
  <h1>swhisper</h1>
  <span class="dir" id="audioDir"></span>
  <button id="refreshBtn" title="Reload file list">↻ Refresh</button>
</header>

<main>
  <div id="files"></div>
  <div id="right">
    <div id="editor"><div class="placeholder">Select an audio file to edit its per-file settings.<br>
      Empty fields use the global configuration (shown as placeholder values).</div></div>
    <div id="editorBar" style="display:none">
      <button class="primary" id="saveBtn">Save sidecar</button>
      <button class="danger" id="deleteBtn">Delete sidecar</button>
      <span class="msg" id="editorMsg"></span>
    </div>
    <div id="runPanel">
      <div id="runBar">
        <span class="dot" id="runDot"></span>
        <select id="pipelineSel"></select>
        <button class="primary" id="startBtn">Start run</button>
        <button id="stopBtn" disabled>Stop</button>
        <span class="status" id="runStatus">idle</span>
        <button id="clearLogBtn" title="Clear log view">Clear</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
let META = null;
let currentBase = null;
let logOffset = 0;
let wasRunning = false;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok && res.status !== 422) throw new Error(data.detail || res.statusText);
  return { status: res.status, data };
}

/* ---------- meta & file list ---------- */

async function loadMeta() {
  META = (await api("/api/meta")).data;
  $("audioDir").textContent = META.audio_dir;
  const sel = $("pipelineSel");
  sel.innerHTML = "";
  for (const p of META.pipelines) {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.label;
    sel.appendChild(o);
  }
}

async function loadFiles() {
  const { data } = await api("/api/files");
  const box = $("files");
  box.innerHTML = "";
  if (!data.files.length) {
    box.innerHTML = '<div class="file"><span class="name" style="color:var(--muted)">No audio files found</span></div>';
    return;
  }
  for (const f of data.files) {
    const div = document.createElement("div");
    div.className = "file" + (f.base === currentBase ? " sel" : "");
    div.dataset.base = f.base;
    const badges = [];
    badges.push(f.transcribed ? '<span class="badge on-ok">transcribed</span>' : '<span class="badge">not transcribed</span>');
    badges.push(f.diarized ? '<span class="badge on-ok">diarized</span>' : '<span class="badge">not diarized</span>');
    if (f.sidecar) badges.push('<span class="badge on-info">per-file settings</span>');
    if (f.will_reprocess) badges.push('<span class="badge on-warn">will reprocess</span>');
    div.innerHTML = `<div class="name">${f.base}</div><div class="badges">${badges.join("")}</div>`;
    div.onclick = () => selectFile(f.base);
    box.appendChild(div);
  }
}

/* ---------- sidecar editor ---------- */

function inputFor(key, spec, value) {
  const globalVal = spec.global === null || spec.global === undefined ? "" : String(spec.global);
  let el;
  if (spec.type === "bool") {
    el = document.createElement("select");
    for (const [v, label] of [["", `global (${globalVal || "unset"})`], ["true", "true"], ["false", "false"]]) {
      const o = document.createElement("option");
      o.value = v; o.textContent = label;
      el.appendChild(o);
    }
    el.value = value !== undefined ? String(value).toLowerCase() : "";
  } else if (key === "SWHISPER_OUTPUT_PREAMBLE" || key === "SWHISPER_INITIAL_PROMPT") {
    el = document.createElement("textarea");
    el.rows = 2;
    el.placeholder = globalVal ? `global: ${globalVal.slice(0, 120)}${globalVal.length > 120 ? "…" : ""}` : "global: (empty)";
    el.value = value !== undefined ? value : "";
  } else {
    el = document.createElement("input");
    el.type = "text";
    el.placeholder = globalVal !== "" ? `global: ${globalVal}` : "global: unset";
    el.value = value !== undefined ? value : "";
  }
  el.dataset.key = key;
  const mark = () => el.classList.toggle("set", el.value.trim() !== "");
  el.addEventListener("input", mark);
  mark();
  return el;
}

async function selectFile(base) {
  currentBase = base;
  document.querySelectorAll("#files .file").forEach(d =>
    d.classList.toggle("sel", d.dataset.base === base));
  const { data } = await api(`/api/sidecar/${encodeURIComponent(base)}`);
  const editor = $("editor");
  editor.innerHTML = `<h2 style="margin:0 0 12px;font-size:15px">${base}</h2>`;
  for (const group of META.groups) {
    const g = document.createElement("div");
    g.className = "group";
    g.innerHTML = `<h3>${group.name}</h3>`;
    for (const key of group.keys) {
      const spec = META.params[key];
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("label");
      label.innerHTML = `${key.replace("SWHISPER_", "")}<span class="stage">${spec.stage}</span>`;
      label.title = key;
      row.appendChild(label);
      row.appendChild(inputFor(key, spec, data.values[key]));
      if (spec.note) {
        const note = document.createElement("div");
        note.className = "note"; note.textContent = spec.note;
        row.appendChild(note);
      }
      g.appendChild(row);
    }
    editor.appendChild(g);
  }
  if (data.unknown && Object.keys(data.unknown).length) {
    const warn = document.createElement("div");
    warn.className = "group";
    warn.innerHTML = `<h3>Unrecognized keys in sidecar (kept out of the form, will be dropped on save)</h3>
      <div class="note">${Object.entries(data.unknown).map(([k, v]) => `${k}=${v}`).join("<br>")}</div>`;
    editor.appendChild(warn);
  }
  $("editorBar").style.display = "";
  $("deleteBtn").disabled = !data.exists;
  setMsg(data.exists ? "Sidecar file exists — blue fields are per-file overrides." : "No sidecar yet — fill in any field and save.", "");
}

function setMsg(text, cls) {
  const m = $("editorMsg");
  m.textContent = text;
  m.className = "msg " + (cls || "");
}

async function saveSidecar() {
  if (!currentBase) return;
  const values = {};
  document.querySelectorAll("#editor [data-key]").forEach(el => {
    if (el.value.trim() !== "") values[el.dataset.key] = el.value.trim();
  });
  const { status, data } = await api(`/api/sidecar/${encodeURIComponent(currentBase)}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(values),
  });
  if (status === 422) {
    setMsg("Invalid values: " + Object.entries(data.errors).map(([k, e]) => `${k}: ${e}`).join(" · "), "err");
    return;
  }
  setMsg(data.exists ? "Saved. The file will be reprocessed on the next run if settings changed." : "All fields empty — sidecar removed.", "ok");
  $("deleteBtn").disabled = !data.exists;
  loadFiles();
}

async function deleteSidecar() {
  if (!currentBase) return;
  await api(`/api/sidecar/${encodeURIComponent(currentBase)}`, { method: "DELETE" });
  await selectFile(currentBase);
  setMsg("Sidecar deleted — file uses global settings again.", "ok");
  loadFiles();
}

/* ---------- run control ---------- */

async function startRun() {
  try {
    await api("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pipeline: $("pipelineSel").value }),
    });
    logOffset = 0;
    $("log").textContent = "";
  } catch (e) { alert(e.message); }
}

async function stopRun() {
  try { await api("/api/run/stop", { method: "POST" }); }
  catch (e) { alert(e.message); }
}

async function pollRun() {
  try {
    const { data } = await api(`/api/run/log?offset=${logOffset}`);
    if (data.lines.length) {
      const log = $("log");
      const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 30;
      log.textContent += data.lines.join("\n") + "\n";
      if (atBottom) log.scrollTop = log.scrollHeight;
      logOffset = data.next;
    }
    const st = (await api("/api/run/status")).data;
    $("startBtn").disabled = st.running;
    $("stopBtn").disabled = !st.running;
    $("pipelineSel").disabled = st.running;
    const dot = $("runDot");
    dot.className = "dot" + (st.running ? " run" : (st.returncode ? " err" : ""));
    if (st.running) {
      const mins = ((Date.now() / 1000 - st.started_at) / 60).toFixed(1);
      $("runStatus").textContent = `running ${st.pipeline} · ${mins} min`;
    } else if (st.pipeline) {
      $("runStatus").textContent = `last run: ${st.pipeline} · exit ${st.returncode ?? "?"}`;
    }
    if (wasRunning && !st.running) loadFiles();  // refresh statuses when a run ends
    wasRunning = st.running;
  } catch (e) { /* server briefly unavailable; keep polling */ }
}

/* ---------- init ---------- */

$("saveBtn").onclick = saveSidecar;
$("deleteBtn").onclick = deleteSidecar;
$("startBtn").onclick = startRun;
$("stopBtn").onclick = stopRun;
$("refreshBtn").onclick = loadFiles;
$("clearLogBtn").onclick = () => { $("log").textContent = ""; };

(async () => {
  await loadMeta();
  await loadFiles();
  setInterval(pollRun, 1000);
})();
</script>
</body>
</html>
