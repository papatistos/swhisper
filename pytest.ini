[pytest]
testpaths = .
python_files = test_*.py
# Manual/live scripts: need real models, network, a GPU, or hardcode a
# personal audio path (see .gitignore). Not part of the tracked suite;
# run them individually with `python <name>.py` instead.
addopts =
    --ignore=test_ina_vad.py
    --ignore=test_pyannote_vad_vs_diarization.py
    --ignore=test_sensevoice_backfill_live.py
    --ignore=test_sensevoice_live.py
markers =
    slow: requires real models, audio files, network access, or a GPU; not run in CI
