[pytest]
testpaths = tests
# The tests import swhisper's modules from the repository root.
pythonpath = .
python_files = test_*.py
# Manual/live scripts at the repository root need real models, network, a GPU,
# or a personal audio path (see .gitignore). They are not part of the tracked
# suite, and testpaths keeps pytest from collecting them; run them
# individually with `python <name>.py` instead.
markers =
    slow: requires real models, audio files, network access, or a GPU; not run in CI
